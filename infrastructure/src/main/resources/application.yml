spring:
  application:
    name: request-management
  datasource:
    url: jdbc:postgresql://localhost:5432/request_db
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
